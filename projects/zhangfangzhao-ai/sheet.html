<!doctype html>
<!-- 角色设定图（像素风）：420×400 逻辑画布 ×6。第一排三视图，第二排表情（细节版头像），第三排他的动作，第四排她的动作和两个人。全部调用 character.js。 -->
<html lang="zh-CN"><head><meta charset="UTF-8" />
<script src="lib/pixel.js"></script>
<script src="character.js"></script>
<style>html, body { margin: 0; overflow: hidden; background: #000; } canvas { display: block; image-rendering: pixelated; }</style>
</head><body><canvas id="out"></canvas>
<script>
const LW = 420, LH = 446, SCALE = 6;
const out = document.getElementById('out'); out.width = LW * SCALE; out.height = LH * SCALE;
const G = PIX.create(LW, LH), { PROPS } = CHAR, T = 0.5;
const light = (x, y) => 0.5 + 0.2 * Math.sin(x * 0.02);
let GL = {};

function panel(x, y, w, h) {
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    if ((i === 0 || i === w - 1) && (j === 0 || j === h - 1)) continue;
    const e = Math.min(i, j, w - 1 - i, h - 1 - j);
    G.px(x + i, y + j, e === 0 ? 0 : e === 1 ? 6 : e === 2 ? 3 : G.dith([10, 11], 0.3 + (1 - j / h) * 0.9, x + i, y + j));
  }
}
function label(s, cx, y, c = 8) { G.text(GL, s, Math.round(cx - G.textW(GL, s) / 2), y, c, 0); }
function row(y, h, title, list) {
  G.text(GL, title, 10, y - 14, 23, 0);
  const w = (LW - 16) / list.length;
  list.forEach((c, i) => { const x = Math.round(8 + i * w), cw = Math.round(w) - 2; panel(x, y, cw, h); c.f(x + cw / 2, y + h - 5, y); label(c.label, x + cw / 2, y + h + 1); });
}
function stool(cx, fy, size) { const k = size / 56, top = Math.round(fy - 18 * k); G.rect(Math.round(cx - 9 * k), top, Math.round(18 * k), 2, 16); G.rect(Math.round(cx - 9 * k), top - 1, Math.round(18 * k), 1, 0); [-8, 6].forEach((d) => G.rect(Math.round(cx + d * k), top + 2, 2, Math.round(fy - top - 2), 14)); }

function render() {
  for (let y = 0; y < LH; y++) for (let x = 0; x < LW; x++) G.px(x, y, G.dith([1, 2], 0.3 + y / LH * 0.6, x, y));
  G.text(GL, '《唉》角色设定 · 像素风', 10, 6, 8, 0);
  const D = (o) => CHAR.draw(G, Object.assign({ t: T, light }, o));
  row(34, 96, '三视图', [
    { label: '他·正面', f: (cx, fy) => D({ who: 'him', x: cx, y: fy, size: 72, facing: 'front' }) },
    { label: '他·侧面', f: (cx, fy) => D({ who: 'him', x: cx, y: fy, size: 72, facing: 'left' }) },
    { label: '他·背面', f: (cx, fy) => D({ who: 'him', x: cx, y: fy, size: 72, facing: 'back' }) },
    { label: '她·正面', f: (cx, fy) => D({ who: 'her', x: cx, y: fy, size: 66, facing: 'front' }) },
    { label: '她·侧面', f: (cx, fy) => D({ who: 'her', x: cx, y: fy, size: 66, facing: 'left' }) },
    { label: '她·背面', f: (cx, fy) => D({ who: 'her', x: cx, y: fy, size: 66, facing: 'back' }) },
  ]);
  row(162, 42, '表情（近景头像）', ['him', 'her'].flatMap((who) => [['neutral', '平静'], ['happy', '开心'], ['shy', '害羞'], ['sad', '难过'], ['cry', '流泪']].map(([e, n]) => ({ label: (who === 'him' ? '他' : '她') + n, f: (cx, fy, top) => CHAR.drawHead(G, { who, x: cx, y: top + 20, r: 12, expression: e, blink: false }) }))));
  row(236, 90, '他的动作', [
    { label: '站', f: (cx, fy) => D({ who: 'him', x: cx, y: fy, size: 56 }) },
    { label: '走', f: (cx, fy) => D({ who: 'him', x: cx, y: fy, size: 56, action: 'walk', t: 0.0 }) },
    { label: '跳', f: (cx, fy) => D({ who: 'him', x: cx, y: fy, size: 46, facing: 'front', action: 'jump', u: 0.52, expression: 'happy' }) },
    { label: '看手机', f: (cx, fy) => { stool(cx + 3, fy, 56); D({ who: 'him', x: cx + 3, y: fy, size: 56, action: 'sitHunch', expression: 'sad', hold: PROPS.phone }); } },
    { label: '塌下去', f: (cx, fy) => D({ who: 'him', x: cx, y: fy, size: 56, action: 'slump', expression: 'sad' }) },
    { label: '伸手', f: (cx, fy) => D({ who: 'him', x: cx + 6, y: fy, size: 56, action: 'reach', expression: 'sad' }) },
    { label: '撑伞', f: (cx, fy) => D({ who: 'him', x: cx, y: fy, size: 52, action: 'holdHigh', hold: PROPS.umbrella }) },
    { label: '端碗', f: (cx, fy) => D({ who: 'him', x: cx + 2, y: fy, size: 56, action: 'hold', expression: 'happy', hold: PROPS.bowl }) },
  ]);
  row(356, 74, '她的动作 · 两个人', [
    { label: '站', f: (cx, fy) => D({ who: 'her', x: cx, y: fy, size: 52 }) },
    { label: '走', f: (cx, fy) => D({ who: 'her', x: cx, y: fy, size: 52, action: 'walk', t: 0.0 }) },
    { label: '跳', f: (cx, fy) => D({ who: 'her', x: cx, y: fy, size: 38, facing: 'front', action: 'jump', u: 0.52, expression: 'happy' }) },
    { label: '回头', f: (cx, fy) => D({ who: 'her', x: cx, y: fy, size: 52, facing: 'right', expression: 'sad' }) },
    { label: '端碗', f: (cx, fy) => D({ who: 'her', x: cx + 2, y: fy, size: 52, action: 'hold', expression: 'shy', hold: PROPS.bowl }) },
    { label: '拥抱', f: (cx, fy) => { D({ who: 'him', x: cx - 9, y: fy, size: 56, facing: 'right', action: 'hug', expression: 'happy' }); D({ who: 'her', x: cx + 9, y: fy, size: 52, facing: 'left', action: 'hug', expression: 'shy' }); } },
    { label: '撑伞护她', f: (cx, fy) => { D({ who: 'her', x: cx - 8, y: fy, size: 42, facing: 'left', expression: 'shy' }); D({ who: 'him', x: cx + 10, y: fy, size: 46, facing: 'left', action: 'holdHigh', hold: PROPS.umbrella }); } },
  ]);
  G.flush(out, SCALE);
}
window.sceneReady = (async () => {
  const fam = await PIX.loadFont('../../assets/fonts/fusion-pixel-12px-zh_hans.woff2');
  GL = PIX.glyphs(fam, '《唉》角色设定 · 像素风三视图表情（近景头像）他她的动作两个人正面侧背平静开心害羞难过流泪站走跳看手机塌下去伸手撑伞端碗回头拥抱护');
  render(); return true;
})();
window.renderAt = async () => { render(); return out.toDataURL('image/png'); };
</script></body></html>
