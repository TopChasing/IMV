    const bx = x - Math.round(size * (glance ? -0.06 : 0.11)), by = y - Math.round(size * 0.66); tmp.rect(bx - 1, by - 1, Math.round(size * 0.24) + 2, Math.round(size * 0.24) + 2, 0); tmp.rect(bx, by, Math.round(size * 0.24), Math.round(size * 0.24), 14);   // 背包
    const [d0, dy0, d1] = [DOOR[0] - cam, DOOR[1], DOOR[2] - cam], leafW = Math.round((d1 - d0) * (1 - st.door));
    for (let i = 0; i < LW * LH; i++) { if (tmp.B[i] === 255) continue; const px = i % LW, py = (i / LW) | 0; if (u > 0.6 && (px < d0 || px >= d1 - leafW || py < dy0)) continue; G.B[i] = tmp.B[i]; }
  }
  // 他：回忆里站着伸手；关门后闪没，现在的他在凳子上闪现
  if (tf >= 113.94 && blinkOut(s, 116.2)) CHAR.draw(G, { who: 'him', x: 300 - cam, y: 204, size: 90, facing: 'right', action: 'reach', u: smooth(seg(tf, 114.95, 115.5)), t: tf, light, expression: 'sad' });
  if (tf < 113.94 || blinkIn(s, 116.2)) CHAR.draw(G, { who: 'him', ...HIM_SEAT, x: HIM_SEAT.x - cam, facing: 'left', action: 'sitHunch', u: 0.6, t: tf, light, expression: 'sad' });
  drawTableTop(G, cam, st); drawLamp(G, cam, st);
  if (tf < 113.94 || cool > 0.5) cold(G);
}
function shotLast(G, s) {   // 第 11 镜：一个人，所有东西停住
  const tf = 117.05, st = { s: tf, tf, I: 0.5, rain: 0.6 };
  drawRoom(G, 0, st);
  CHAR.draw(G, { who: 'him', ...HIM_SEAT, facing: 'left', action: 'sitHunch', u: 0.6, t: tf, light: roomLight(0.5), expression: 'sad' });
  drawTableTop(G, 0, st); drawLamp(G, 0, st);
  cold(G);
}
function pushCopy(dst, A, B, u, dir) {   // dir = 1：新画面从右边推进来；-1：从左边
  const o = Math.round(LW * smooth(u));
  for (let y = 0; y < LH; y++) for (let x = 0; x < LW; x++) {
    const sx = dir > 0 ? x + o : x - o;
    dst.B[y * LW + x] = sx >= 0 && sx < LW ? A.B[y * LW + sx] : B.B[y * LW + (dir > 0 ? sx - LW : sx + LW)];
  }
}
function frame(t) {
  const s = T0 + t; G.fill(0);
  if (inS(s, 'room1')) shotRoom1(G, s);
  else if (inS(s, 'push1')) { shotRoom1(GA, s); shotStreet(GB, 82.92); pushCopy(G, GA, GB, seg(q(s), 82.42, 82.92), 1); }
  else if (inS(s, 'street')) shotStreet(G, s);
  else if (inS(s, 'push2')) { shotStreet(GA, s); shotRoom7(GB, 99.47); pushCopy(G, GA, GB, seg(q(s), 98.97, 99.47), -1); }
  else if (inS(s, 'room7') || inS(s, 'zoomIn')) {
    const tf = q(s), pan = Math.round(53 * smooth(seg(tf, 103.61, 104.12)));
    if (tf < 103.61) shotRoom7(G, s);
    else { shotRoom7(GA, s); GB.fill(0); const z = tf < 104.12 ? 1 : [2, 4, 7][Math.min(2, Math.floor((tf - 104.12) * 6))]; zoomCopy(G, GA, 160 + pan * (z === 1 ? 1 : 0) + (z > 1 ? 53 : 0), z > 1 ? 65 : 120, z); }
  }
  else if (inS(s, 'sea')) drawSea(G, s);
  else if (inS(s, 'sweep')) {   // 大浪从左往右扫过，浪后面露出近景
    drawSea(GA, s); drawClose(GB, 109.81); const front = Math.round(lerp(-30, LW + 30, smooth(seg(q(s), 109.30, 109.81))));
    for (let y = 0; y < LH; y++) for (let x = 0; x < LW; x++) { const d = front - x; G.B[y * LW + x] = d > 24 ? GB.B[y * LW + x] : d > 0 ? G.dith([27, 6, 8], 0.6 + (24 - d) / 10 + Math.sin(y * 0.3) * 0.4, x, y) : GA.B[y * LW + x]; }
  }
  else if (inS(s, 'close')) drawClose(G, s);
  else if (inS(s, 'zoomOut')) { shotDoor(GA, 113.10); const z = [7, 4, 2][Math.min(2, Math.floor((q(s) - 113.10) * 9))]; zoomCopy(G, GA, 160, 65, z); }
  else if (inS(s, 'door')) shotDoor(G, s);
  else shotLast(G, s);
  drawHUD(G, heartsAt(s), heartFlash(q(s)));
  drawDialog(G, s);
  G.flush(out, SCALE);
}
window.sceneReady = (async () => {
  const fam = await PIX.loadFont('../../../assets/fonts/fusion-pixel-12px-zh_hans.woff2');
  GL = PIX.glyphs(fam, (window.LYRICS || []).map((l) => l[2]).join(''));
  frame(0); return true;
})();
window.renderAt = async (t) => { frame(t); return out.toDataURL('image/png'); };
